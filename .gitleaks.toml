# gitleaks: zadana pravila + iznimke za ovaj repozitorij.
# Pojedinačni lažno pozitivni nalazi: otisak (Fingerprint) iz izvještaja upišite u .gitleaksignore.
title = "devsecops"

[extend]
useDefault = true

[allowlist]
description = "Generirani izvještaji i alati"
paths = [
  '''^izvjestaji/''',
  '''^\.ci-alati/''',
  # Dev mailboxes intentionally contain one-time password reset links.
  '''^src/Ulaznica\.Api/data/posta/''',
  # This test fixture key is a nonfunctional placeholder used only by test configuration.
  '''^tests/Okviri\.Tests/TestnaAutentikacija\.cs$''',
]
